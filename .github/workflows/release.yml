name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            binary: goodcommit.exe
            asset: goodcommit-windows.exe
          - os: ubuntu-latest
            binary: goodcommit
            asset: goodcommit-linux
          - os: macos-latest
            binary: goodcommit-macos
            asset: goodcommit-macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install libcurl dev headers (Ubuntu only)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev

      - name: Build
        shell: bash
        run: |
          cd cli-tool
          mkdir -p bin
          SOURCES=$(find src -name "*.cpp" | tr "\n" " ")
          if [ "${{ runner.os }}" = "Windows" ]; then
            g++ -std=c++20 -O2 -static -I include -o bin/${{ matrix.binary }} $SOURCES -lwininet -pthread
          else
            g++ -std=c++20 -O2 -I include -o bin/${{ matrix.binary }} $SOURCES -lcurl -pthread
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: cli-tool/bin/${{ matrix.binary }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/goodcommit-windows.exe/goodcommit.exe
            artifacts/goodcommit-linux/goodcommit
            artifacts/goodcommit-macos/goodcommit-macos
