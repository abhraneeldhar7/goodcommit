name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches package version
        shell: bash
        run: |
          cd cli-tool
          pkg=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "::error::Tag v$tag does not match cli-tool/package.json version $pkg"
            exit 1
          fi

      - name: Install libcurl dev headers (Ubuntu only)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev

      - name: Build
        shell: bash
        run: |
          cd cli-tool
          node scripts/build.js --release

      - name: Resolve names
        id: names
        shell: bash
        run: |
          cd cli-tool
          echo "binary=$(node -p "require('./config.json').binaries[process.platform]")" >> "$GITHUB_OUTPUT"
          echo "asset=$(node -p "require('./config.json').assets[process.platform]")" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.names.outputs.asset }}
          path: cli-tool/bin/${{ steps.names.outputs.binary }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*/*

      - name: Publish to npm
        working-directory: cli-tool
        run: npm publish
